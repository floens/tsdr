[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsdr"
version = "0.1.0"
description = "TSDR is a TUI for Software Defined Radio with a command-line interface."
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.7",
    "numpy>=2.4.6",
    "soundcard>=0.4.6",
    "zstandard>=0.25.0",
    "av>=17.0.1",
    "reedsolo>=1.7.0",
    "numba>=0.65.1",
    "platformdirs>=4.9.6",
    "tomli_w>=1.2.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pyfftw>=0.15.1",
]

[project.scripts]
tsdr = "tsdr.__main__:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.14",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "scipy>=1.17.1",
    "textual-dev>=1.8.0",
]
debug = [
    "pyqtgraph>=0.13.0",
    "PyQt6>=6.11.0",
]
rtlsdr = [
    "pyrtlsdr[lib]>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tsdr"]

[tool.uv]
no-build-package = ["pyqt6"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
# Allow None access when we have runtime checks
strict_optional = true
warn_no_return = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PLC0415", # import-outside-toplevel (enforce module-level imports)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from within except
    "N818",  # Exception naming (SDRException is fine)
    "SIM105", # try-except-pass is clearer than contextlib.suppress
    "SIM108", # if-else sometimes clearer than ternary
    "SIM115", # context manager for files (we manage lifecycle manually)
]

[tool.ruff.lint.isort]
known-first-party = ["tsdr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
